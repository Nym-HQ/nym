overwrite: true
schema: src/graphql/typeDefs/index.ts
documents: './src/**/*.{tsx,ts}'
hooks:
  afterOneFileWrite:
    # `eslint --fix` removed: it runs during postinstall (via `generate`) and
    # crashes the install because eslint 8 rejects @next/eslint-plugin-next@16's
    # flat-config `name` property. The output is generated + `// eslint-disable`.
    - prettier --write
generates:
  ./src/graphql/types.generated.ts:
    plugins:
      - add:
          content: |
            // eslint-disable
            // ⚠️ DO NOT EDIT ⚠️
            // This file is automatically generated, run yarn run generate to update
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHOC: false
      withHooks: true
      withComponent: false
      reactApolloVersion: 3
      preResolveTypes: true
